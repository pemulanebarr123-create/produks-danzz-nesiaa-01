<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANZZ STORE — Official Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --neon-pink: #ff0080;
    --neon-cyan: #00ffff;
    --neon-yellow: #ffff00;
    --neon-green: #00ff88;
    --neon-purple: #bf00ff;
    --dark: #050510;
    --dark2: #0a0a20;
    --dark3: #0f0f2e;
    --card: #0d0d25;
    --card2: #12122a;
    --border: rgba(0,255,255,0.2);
    --text: #e0e0ff;
    --text-dim: #8080b0;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BG ANIMATED */
  body::before {
    content:'';
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(255,0,128,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(0,255,255,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(191,0,255,0.05) 0%, transparent 70%);
    pointer-events:none; z-index:0;
    animation: bgPulse 8s ease-in-out infinite alternate;
  }
  @keyframes bgPulse {
    0% { opacity:0.6; }
    100% { opacity:1; }
  }

  /* GRID LINES */
  body::after {
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events:none; z-index:0;
  }

  .page { position:relative; z-index:1; }
  .hidden { display:none !important; }

  /* ====== HEADER ====== */
  header {
    padding: 20px 24px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(5,5,16,0.9);
    backdrop-filter: blur(12px);
    position:sticky; top:0; z-index:100;
  }
  .logo {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
    text-shadow: none;
    filter: drop-shadow(0 0 20px rgba(255,0,128,0.5));
  }
  .logo span {
    font-size:11px;
    font-family:'Space Mono', monospace;
    display:block;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    letter-spacing:5px; margin-top:-4px;
  }
  .nav-btns { display:flex; gap:10px; flex-wrap:wrap; }
  .nav-btn {
    padding: 8px 16px;
    border: 1px solid var(--neon-cyan);
    background: transparent;
    color: var(--neon-cyan);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px; font-weight:700;
    cursor: pointer; letter-spacing:1px;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    transition: all 0.2s;
  }
  .nav-btn:hover, .nav-btn.active {
    background: var(--neon-cyan);
    color: var(--dark);
  }
  .nav-btn.admin-btn { border-color: var(--neon-pink); color:var(--neon-pink); }
  .nav-btn.admin-btn:hover { background:var(--neon-pink); color:var(--dark); }

  /* ====== HERO ====== */
  .hero {
    text-align:center;
    padding: 60px 20px 40px;
    position:relative;
  }
  .hero-badge {
    display:inline-block;
    padding: 6px 20px;
    border: 1px solid var(--neon-green);
    color: var(--neon-green);
    font-size: 11px; letter-spacing: 4px;
    font-family: 'Space Mono', monospace;
    margin-bottom: 20px;
    animation: glow-green 2s ease-in-out infinite alternate;
  }
  @keyframes glow-green { from { box-shadow: 0 0 5px var(--neon-green); } to { box-shadow: 0 0 20px var(--neon-green), 0 0 40px rgba(0,255,136,0.3); } }

  .hero h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(32px, 6vw, 72px);
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 16px;
    background: linear-gradient(135deg, #fff 0%, var(--neon-cyan) 40%, var(--neon-pink) 70%, #fff 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 30px rgba(0,255,255,0.4));
    animation: shimmer 4s linear infinite;
    background-size: 200%;
  }
  @keyframes shimmer { 0%{background-position:0%} 100%{background-position:200%} }

  .hero p {
    font-size:16px; color:var(--text-dim); max-width:500px; margin:0 auto 30px;
    letter-spacing:1px;
  }

  /* SALURAN WA */
  .channels {
    display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
    margin-bottom: 40px;
  }
  .channel-card {
    display:flex; align-items:center; gap:10px;
    padding: 12px 20px;
    background: rgba(0,255,136,0.05);
    border: 1px solid rgba(0,255,136,0.3);
    text-decoration:none; color: var(--neon-green);
    font-size: 13px; font-weight:700; letter-spacing:1px;
    clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
    transition: all 0.2s;
  }
  .channel-card:hover {
    background: rgba(0,255,136,0.15);
    box-shadow: 0 0 20px rgba(0,255,136,0.3);
    transform: translateY(-2px);
  }
  .channel-card svg { width:20px; height:20px; fill: currentColor; }

  /* ====== PRODUCTS ====== */
  .section-title {
    text-align:center;
    font-family: 'Orbitron', monospace;
    font-size: 18px; font-weight:700;
    letter-spacing: 4px;
    color: var(--neon-cyan);
    margin-bottom: 30px;
    position:relative;
  }
  .section-title::after {
    content:'';
    display:block; width:60px; height:2px;
    background: linear-gradient(90deg, var(--neon-pink), var(--neon-cyan));
    margin: 10px auto 0;
  }

  .products-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    padding: 0 20px 60px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .product-card {
    background: var(--card);
    border: 1px solid var(--border);
    position:relative; overflow:hidden;
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
    cursor:pointer;
    transition: all 0.3s;
    animation: fadeInUp 0.6s ease both;
  }
  .product-card::before {
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(255,0,128,0.05), rgba(0,255,255,0.05));
    opacity:0; transition:opacity 0.3s;
  }
  .product-card:hover { transform: translateY(-6px); border-color: var(--neon-pink); box-shadow: 0 10px 40px rgba(255,0,128,0.2); }
  .product-card:hover::before { opacity:1; }

  @keyframes fadeInUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

  .card-tag {
    position:absolute; top:12px; right:12px;
    padding: 3px 10px;
    font-size:10px; letter-spacing:2px;
    font-family:'Space Mono', monospace;
    font-weight:700;
  }
  .tag-available { background:rgba(0,255,136,0.15); border:1px solid var(--neon-green); color:var(--neon-green); }
  .tag-unavailable { background:rgba(255,80,80,0.15); border:1px solid #ff5050; color:#ff5050; }

  .card-icon {
    font-size: 40px;
    padding: 24px 24px 8px;
    display:block;
  }
  .card-body { padding: 0 24px 24px; }
  .card-game {
    font-size:11px; letter-spacing:3px; color:var(--neon-cyan);
    font-family:'Space Mono', monospace; margin-bottom:4px;
  }
  .card-title {
    font-family:'Orbitron', monospace;
    font-size:16px; font-weight:700;
    color:#fff; margin-bottom:10px;
  }
  .card-prices { margin-bottom:16px; }
  .price-row {
    display:flex; justify-content:space-between; align-items:center;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size:14px;
  }
  .price-row:last-child { border-bottom:none; }
  .price-label { color:var(--text-dim); }
  .price-val {
    font-family:'Orbitron', monospace; font-size:13px; font-weight:700;
    color: var(--neon-yellow);
  }

  .btn-buy {
    width:100%;
    padding: 12px;
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
    border: none; color:#fff;
    font-family:'Orbitron', monospace; font-size:12px; font-weight:700;
    letter-spacing:2px; cursor:pointer;
    clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
    transition: all 0.2s;
    position:relative; overflow:hidden;
  }
  .btn-buy::after {
    content:''; position:absolute; top:0; left:-100%;
    width:100%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.4s;
  }
  .btn-buy:hover { transform:scale(1.02); box-shadow:0 0 20px rgba(255,0,128,0.5); }
  .btn-buy:hover::after { left:100%; }
  .btn-disabled {
    background: rgba(255,255,255,0.05); color:var(--text-dim); cursor:not-allowed;
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* ====== MODAL ====== */
  .modal-overlay {
    position:fixed; inset:0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    z-index:500;
    display:flex; align-items:center; justify-content:center;
    padding:16px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  .modal {
    background: var(--dark2);
    border: 1px solid var(--neon-cyan);
    max-width: 480px; width:100%;
    clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 24px, 100% 100%, 24px 100%, 0 calc(100% - 24px));
    box-shadow: 0 0 60px rgba(0,255,255,0.15);
    animation: slideUp 0.3s ease;
    max-height: 90vh; overflow-y:auto;
  }
  @keyframes slideUp { from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1} }

  .modal-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center;
    position:sticky; top:0; background:var(--dark2); z-index:2;
  }
  .modal-title {
    font-family:'Orbitron', monospace; font-size:14px; font-weight:700;
    color: var(--neon-cyan); letter-spacing:2px;
  }
  .modal-close {
    background:none; border:none; color:var(--text-dim);
    font-size:20px; cursor:pointer; line-height:1;
  }
  .modal-close:hover { color:var(--neon-pink); }
  .modal-body { padding:20px 24px 24px; }

  .step-indicator {
    display:flex; gap:8px; margin-bottom:24px;
  }
  .step {
    flex:1; height:3px;
    background: rgba(255,255,255,0.1);
    transition: background 0.3s;
  }
  .step.active { background: var(--neon-cyan); }
  .step.done { background: var(--neon-green); }

  .step-label {
    font-size:11px; letter-spacing:2px; color:var(--text-dim);
    margin-bottom:12px; font-family:'Space Mono', monospace;
  }

  .order-summary {
    background: rgba(0,255,255,0.05);
    border: 1px solid rgba(0,255,255,0.2);
    padding:16px; margin-bottom:20px;
  }
  .order-item {
    display:flex; justify-content:space-between; font-size:14px; padding:4px 0;
  }
  .order-item.total {
    border-top:1px solid var(--border); margin-top:8px; padding-top:8px;
    font-weight:700; font-family:'Orbitron', monospace; font-size:13px;
    color:var(--neon-yellow);
  }

  /* SELECT OPTION */
  .option-group { margin-bottom:16px; }
  .option-label { font-size:12px; letter-spacing:2px; color:var(--text-dim); margin-bottom:8px; display:block; }
  .options-row { display:flex; flex-wrap:wrap; gap:8px; }
  .opt-btn {
    padding:8px 16px;
    border:1px solid var(--border);
    background:transparent; color:var(--text);
    font-family:'Rajdhani', sans-serif; font-size:13px; font-weight:600;
    cursor:pointer; transition:all 0.2s;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  }
  .opt-btn:hover, .opt-btn.selected {
    border-color:var(--neon-pink); color:var(--neon-pink);
    background:rgba(255,0,128,0.1);
  }

  /* PAYMENT METHOD */
  .payment-methods { display:flex; flex-direction:column; gap:12px; margin-bottom:20px; }
  .pay-method {
    border:1px solid var(--border); padding:14px 16px;
    cursor:pointer; transition:all 0.2s;
    display:flex; align-items:center; gap:12px;
  }
  .pay-method:hover, .pay-method.selected {
    border-color:var(--neon-cyan);
    background:rgba(0,255,255,0.05);
  }
  .pay-icon { font-size:24px; }
  .pay-info { flex:1; }
  .pay-name { font-weight:700; font-size:15px; }
  .pay-num { font-size:13px; color:var(--neon-yellow); font-family:'Space Mono', monospace; }
  .pay-radio {
    width:16px; height:16px; border:2px solid var(--border);
    border-radius:50%; position:relative;
  }
  .pay-method.selected .pay-radio::after {
    content:''; position:absolute; inset:3px;
    background:var(--neon-cyan); border-radius:50%;
  }

  .qris-img {
    width:100%; max-width:220px; display:block; margin:0 auto;
    border: 2px solid var(--neon-cyan);
    margin-bottom:8px;
  }

  /* UPLOAD BUKTI */
  .upload-zone {
    border: 2px dashed rgba(0,255,255,0.3);
    padding:30px; text-align:center;
    cursor:pointer; transition:all 0.2s; margin-bottom:16px;
    position:relative;
  }
  .upload-zone:hover { border-color:var(--neon-cyan); background:rgba(0,255,255,0.05); }
  .upload-zone input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .upload-zone svg { width:32px; height:32px; color:var(--neon-cyan); margin-bottom:8px; }
  .upload-zone p { font-size:13px; color:var(--text-dim); }
  .upload-preview { width:100%; max-height:200px; object-fit:contain; margin-top:10px; display:none; }

  .form-group { margin-bottom:14px; }
  .form-label { font-size:12px; letter-spacing:2px; color:var(--text-dim); margin-bottom:6px; display:block; }
  .form-input {
    width:100%; padding:10px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border); color:var(--text);
    font-family:'Rajdhani', sans-serif; font-size:14px;
    outline:none; transition:border 0.2s;
  }
  .form-input:focus { border-color:var(--neon-cyan); }

  .btn-action {
    width:100%; padding:14px;
    font-family:'Orbitron', monospace; font-size:12px; font-weight:700;
    letter-spacing:2px; border:none; cursor:pointer;
    clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
    transition:all 0.2s;
    margin-bottom:8px;
  }
  .btn-primary { background:linear-gradient(135deg,var(--neon-cyan),var(--neon-green)); color:var(--dark); }
  .btn-primary:hover { box-shadow:0 0 20px rgba(0,255,255,0.4); transform:scale(1.01); }
  .btn-wa { background:linear-gradient(135deg,#25D366,#128C7E); color:#fff; }
  .btn-wa:hover { box-shadow:0 0 20px rgba(37,211,102,0.4); }
  .btn-secondary { background:rgba(255,255,255,0.08); color:var(--text); }

  /* SUCCESS */
  .success-box {
    text-align:center; padding:20px 0;
  }
  .success-icon { font-size:60px; margin-bottom:16px; animation:bounce 1s ease infinite alternate; }
  @keyframes bounce { from{transform:scale(1)} to{transform:scale(1.1)} }
  .success-title { font-family:'Orbitron', monospace; font-size:18px; color:var(--neon-green); margin-bottom:8px; }
  .success-msg { font-size:14px; color:var(--text-dim); line-height:1.6; }

  /* ====== ADMIN ====== */
  .admin-page { padding:20px; max-width:1000px; margin:0 auto; }
  .admin-login-box {
    max-width:360px; margin:60px auto;
    background:var(--card); border:1px solid var(--border);
    padding:32px;
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
  }
  .admin-login-box h2 {
    font-family:'Orbitron', monospace; font-size:16px;
    color:var(--neon-pink); letter-spacing:3px; margin-bottom:20px; text-align:center;
  }
  .tabs { display:flex; gap:0; margin-bottom:24px; border-bottom:1px solid var(--border); }
  .tab-btn {
    flex:1; padding:10px; background:none; border:none;
    font-family:'Rajdhani',sans-serif; font-size:14px; font-weight:700;
    letter-spacing:1px; color:var(--text-dim); cursor:pointer;
    border-bottom:2px solid transparent; transition:all 0.2s;
  }
  .tab-btn:hover, .tab-btn.active { color:var(--neon-cyan); border-bottom-color:var(--neon-cyan); }

  .order-list { display:flex; flex-direction:column; gap:12px; }
  .order-card {
    background:var(--card2); border:1px solid var(--border); padding:16px;
    display:flex; flex-wrap:wrap; gap:12px; align-items:center;
  }
  .order-info { flex:1; min-width:200px; }
  .order-prod { font-family:'Orbitron', monospace; font-size:13px; color:var(--neon-cyan); }
  .order-meta { font-size:13px; color:var(--text-dim); margin-top:4px; }
  .order-price { font-family:'Orbitron', monospace; font-size:14px; color:var(--neon-yellow); }
  .order-status {
    padding:4px 12px; font-size:11px; letter-spacing:2px;
    font-family:'Space Mono', monospace; font-weight:700;
  }
  .status-pending { background:rgba(255,200,0,0.1); border:1px solid gold; color:gold; }
  .status-confirmed { background:rgba(0,255,136,0.1); border:1px solid var(--neon-green); color:var(--neon-green); }
  .status-rejected { background:rgba(255,80,80,0.1); border:1px solid #ff5050; color:#ff5050; }
  .btn-sm {
    padding:6px 14px; font-size:11px; font-family:'Space Mono', monospace;
    border:none; cursor:pointer; font-weight:700; letter-spacing:1px;
    transition:all 0.2s;
  }
  .btn-confirm { background:var(--neon-green); color:var(--dark); }
  .btn-reject { background:#ff5050; color:#fff; }
  .btn-confirm:hover { box-shadow:0 0 10px rgba(0,255,136,0.5); }
  .btn-reject:hover { box-shadow:0 0 10px rgba(255,80,80,0.5); }

  /* STOCK UPLOAD */
  .stock-section { margin-top:20px; }
  .stock-card {
    background:var(--card2); border:1px solid var(--border); padding:20px; margin-bottom:16px;
  }
  .stock-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .stock-name { font-family:'Orbitron', monospace; font-size:14px; color:var(--neon-cyan); }
  .stock-count { font-family:'Space Mono', monospace; font-size:12px; color:var(--neon-yellow); }
  .stock-input-area { display:flex; flex-direction:column; gap:8px; }
  .stock-textarea {
    width:100%; min-height:100px; padding:10px;
    background:rgba(255,255,255,0.03); border:1px solid var(--border);
    color:var(--text); font-family:'Space Mono', monospace; font-size:12px;
    resize:vertical; outline:none;
  }
  .stock-textarea:focus { border-color:var(--neon-cyan); }
  .stock-textarea::placeholder { color:var(--text-dim); }
  .stock-list {
    max-height:200px; overflow-y:auto;
    background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.05);
    padding:10px;
  }
  .stock-item {
    display:flex; justify-content:space-between; align-items:center;
    padding:6px; border-bottom:1px solid rgba(255,255,255,0.04); font-size:13px;
  }
  .stock-item:last-child { border-bottom:none; }
  .del-stock { background:none; border:none; color:#ff5050; cursor:pointer; font-size:16px; line-height:1; }

  /* PROOF IMAGE MODAL */
  .proof-img { width:100%; max-height:300px; object-fit:contain; border:1px solid var(--border); margin-top:8px; }

  /* EMPTY STATE */
  .empty-state {
    text-align:center; padding:40px;
    color:var(--text-dim); font-size:14px;
  }
  .empty-state .empty-icon { font-size:40px; margin-bottom:12px; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:var(--dark); }
  ::-webkit-scrollbar-thumb { background:var(--neon-cyan); border-radius:2px; }

  /* NOTIFICATION */
  .notif {
    position:fixed; top:80px; right:20px; z-index:999;
    padding:12px 20px;
    background:var(--dark2); border:1px solid var(--neon-green);
    color:var(--neon-green); font-size:13px; font-weight:700; letter-spacing:1px;
    animation:slideInRight 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    box-shadow:0 0 20px rgba(0,255,136,0.3);
  }
  @keyframes slideInRight { from{transform:translateX(100px);opacity:0} to{transform:translateX(0);opacity:1} }

    const buyable = tag==='available';
    return `
    <div class="product-card" style="animation-delay:${i*0.08}s">

      <span class="card-icon">${p.icon}</span>

// ============================================================
// BUY MODAL

let modalProduct = null;
let selectedOption = null;
let selectedPayment = null;

function openBuy(pid){
  modalProduct = PRODUCTS.find(p=>p.id===pid);

  selectedPayment = null;
  state.currentStep = 1;
  document.getElementById('modal-title').textContent = modalProduct.title;
  renderModalStep();
  document.getElementById('buy-modal').classList.remove('hidden');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('buy-modal').classList.add('hidden');
  document.body.style.overflow='';
}

function renderModalStep(){
  const body = document.getElementById('modal-body');
  if(state.currentStep===1) renderStep1(body);
  else if(state.currentStep===2) renderStep2(body);
  else if(state.currentStep===3) renderStep3(body);
  else if(state.currentStep===4) renderStep4(body);
}

function renderStep1(body){
  const p = modalProduct;
  let optHTML = '';
  if(p.prices.length>1){
    optHTML = `<div class="option-group">

    </div>`;
  } else if(p.prices.length===1){
    selectedOption = {label:p.prices[0].label, value:p.prices[0].value};
  }

    <div class="step-indicator">

    </div>
    <div class="step-label">LANGKAH 1 — PILIH PRODUK</div>

      <div style="font-family:'Orbitron',monospace;font-size:15px;color:#fff;margin-bottom:8px;">${p.icon} ${p.title}</div>
      <div style="font-size:13px;color:var(--text-dim);">${p.description}</div>

      <label class="form-label">USERNAME / NAMA</label>
      <input type="text" class="form-input" id="buyer-name" placeholder="Nama kamu...">
    </div>
    <div class="form-group">
      <label class="form-label">NO. WA / KONTAK</label>
      <input type="text" class="form-input" id="buyer-wa" placeholder="08xxxxxxxxxx">
    </div>
    <button class="btn-action btn-primary" onclick="goStep2()">LANJUT KE PEMBAYARAN →</button>

}

function selectOption(label,value,btn){
  selectedOption = {label,value};
  btn.closest('.options-row').querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
}

function goStep2(){
  const name = document.getElementById('buyer-name').value.trim();
  const wa = document.getElementById('buyer-wa').value.trim();
  if(!name||!wa){showNotif('⚠️ Isi nama dan nomor WA dulu!','error');return;}

    id: 'ORD-'+Date.now(),
    product: modalProduct.title,
    productId: modalProduct.id,
    option: selectedOption,
    buyerName: name,
    buyerWa: wa,
    status:'pending',

    proof:null,
    payMethod:null,

}

          <div class="pay-num">Scan QR Code</div>

      <img src="https://ibb.co/bgZRgpcy" alt="QRIS" class="qris-img" onerror="this.style.display='none';document.getElementById('qris-note').style.display='block'">
      <p id="qris-note" style="display:none;font-size:12px;color:var(--neon-yellow);padding:10px;border:1px solid var(--neon-yellow);">Buka link QRIS: <a href="https://ibb.co/bgZRgpcy" target="_blank" style="color:var(--neon-cyan)">Klik di sini</a></p>
    </div>
    <button class="btn-action btn-primary" onclick="goStep3()">LANJUT UPLOAD BUKTI →</button>
    <button class="btn-action btn-secondary" onclick="goBack(1)">← KEMBALI</button>
  `;
}

function selectPay(method, el){
  selectedPayment = method;
  document.querySelectorAll('.pay-method').forEach(m=>m.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('qris-display').style.display = method==='qris' ? 'block' : 'none';
}

function goStep3(){
  if(!selectedPayment){showNotif('⚠️ Pilih metode pembayaran!','error');return;}

}

function renderStep3(body){
  body.innerHTML = `
    <div class="step-indicator">
      <div class="step done"></div><div class="step done"></div><div class="step active"></div><div class="step"></div>
    </div>
    <div class="step-label">LANGKAH 3 — UPLOAD BUKTI TRANSFER</div>

      <div class="order-item"><span>Bayar ke</span><span style="color:var(--neon-cyan)">${state.currentOrder.payMethod}</span></div>

      <input type="file" accept="image/*" onchange="handleUpload(event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>

    <button class="btn-action btn-secondary" onclick="goBack(2)">← KEMBALI</button>

function handleUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    state.currentOrder.proof = ev.target.result;
    const img = document.getElementById('preview-img');
    img.src = ev.target.result;
    img.style.display='block';
    document.getElementById('upload-zone').querySelector('p').textContent = '✅ Foto terupload!';
  };
  reader.readAsDataURL(file);
}

function goStep4(){
  if(!state.currentOrder.proof){showNotif('⚠️ Upload bukti transfer dulu!','error');return;}
  state.currentOrder.note = document.getElementById('order-note').value;
  // SAVE ORDER
  state.orders.unshift(state.currentOrder);
  saveOrders();
  state.currentStep=4;
  renderModalStep();
}

  state.currentStep = step;
  renderModalStep();
}

// ============================================================
// ADMIN
// ============================================================
function showAdminLogin(){
  showPage('admin');
  if(!state.adminLoggedIn){
    document.getElementById('admin-login').classList.remove('hidden');
    document.getElementById('admin-dashboard').classList.add('hidden');
  } else {
    document.getElementById('admin-login').classList.add('hidden');
    document.getElementById('admin-dashboard').classList.remove('hidden');
    renderAdminOrders();
    renderStockManager();
  }
}

function adminLogin(){
  const u = document.getElementById('admin-user').value;
  const p = document.getElementById('admin-pass').value;
  if(u===ADMIN_USER && p===ADMIN_PASS){
    state.adminLoggedIn=true;
    document.getElementById('admin-login').classList.add('hidden');
    document.getElementById('admin-dashboard').classList.remove('hidden');
    renderAdminOrders();
    renderStockManager();
    showNotif('✅ Login berhasil!');
  } else {
    showNotif('❌ Username/password salah!','error');
  }
}
function adminLogout(){
  state.adminLoggedIn=false;
  showPage('home');
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active', (i===0&&tab==='orders')||(i===1&&tab==='stock'));
  });
  document.getElementById('tab-orders').classList.toggle('hidden', tab!=='orders');
  document.getElementById('tab-stock').classList.toggle('hidden', tab!=='stock');
}

function renderAdminOrders(){
  const c = document.getElementById('order-list-container');
  if(state.orders.length===0){
    c.innerHTML=`<div class="empty-state"><div class="empty-icon">📭</div>Belum ada pesanan masuk.</div>`;
    return;
  }
  c.innerHTML = `<div class="order-list">${state.orders.map(o=>`
    <div class="order-card" id="ocard-${o.id}">
      <div class="order-info">
        <div class="order-prod">${o.product}</div>
        <div class="order-meta">📦 ${o.option?.label||'-'} · 👤 ${o.buyerName} · 📱 ${o.buyerWa}</div>
        <div class="order-meta">💳 ${o.payMethod||'-'} · ⏰ ${o.time}</div>
        ${o.note?`<div class="order-meta">📝 ${o.note}</div>`:''}
        ${o.proof?`<img src="${o.proof}" class="proof-img" style="max-height:120px;object-fit:contain;">`:'' }
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end;">
        <div class="order-price">${o.option?.value||'-'}</div>
        <div class="order-status status-${o.status}">${o.status.toUpperCase()}</div>
        ${o.status==='pending'?`
          <button class="btn-sm btn-confirm" onclick="confirmOrder('${o.id}')">✔ KONFIRMASI</button>
          <button class="btn-sm btn-reject" onclick="rejectOrder('${o.id}')">✖ TOLAK</button>
        `:o.status==='confirmed'?`
          <a href="https://wa.me/62${o.buyerWa.replace(/^0/,'').replace(/\D/,'')}?text=${encodeURIComponent('Halo '+o.buyerName+'! Pembayaran kamu sudah dikonfirmasi oleh admin DANZZ STORE. Produk akan segera diproses! 🎉')}" target="_blank">
            <button class="btn-sm btn-confirm">💬 WA BUYER</button>
          </a>
        `:''}
      </div>
    </div>
  `).join('')}</div>`;
}

function confirmOrder(id){
  const o = state.orders.find(x=>x.id===id);
  if(!o) return;
  o.status='confirmed';
  saveOrders();
  renderAdminOrders();
  showNotif('✅ Order dikonfirmasi!');
  // Send WA to buyer
  const msg = encodeURIComponent(`Halo ${o.buyerName}! Pembayaran kamu sudah DIKONFIRMASI ✅\nProduk: ${o.product} (${o.option?.label})\nOrder ID: ${o.id}\nSegera kirim chat ke admin untuk klaim produk kamu!`);
  window.open(`https://wa.me/62${o.buyerWa.replace(/^0/,'').replace(/\D/,'')}?text=${msg}`,'_blank');
}

function rejectOrder(id){
  if(!confirm('Yakin tolak order ini?')) return;
  const o = state.orders.find(x=>x.id===id);
  if(!o) return;
  o.status='rejected';
  saveOrders();
  renderAdminOrders();
  showNotif('❌ Order ditolak.','error');
}

// ============================================================
// STOCK MANAGER
// ============================================================
function renderStockManager(){
  const c = document.getElementById('stock-manager');
  const accountProducts = PRODUCTS.filter(p=>p.stockType==='account');
  c.innerHTML = accountProducts.map(p=>{
    const stocks = state.stocks[p.id]||[];
    return `
    <div class="stock-card">
      <div class="stock-header">
        <div class="stock-name">${p.icon} ${p.title}</div>
        <div class="stock-count">📦 ${stocks.length} STOCK</div>
      </div>
      <div class="stock-input-area">
        <label class="form-label">TAMBAH STOCK (1 akun per baris)</label>
        <textarea class="stock-textarea" id="stock-input-${p.id}" placeholder="user:pass\nuser2:pass2\n..."></textarea>
        <div style="display:flex;gap:8px;">
          <button class="btn-sm btn-confirm" onclick="addStock('${p.id}')">➕ TAMBAH STOCK</button>
          <button class="btn-sm btn-reject" onclick="clearStock('${p.id}')">🗑 HAPUS SEMUA</button>
        </div>
      </div>
      ${stocks.length>0?`
      <div style="margin-top:12px;">
        <label class="form-label">LIST STOCK (${stocks.length} akun)</label>
        <div class="stock-list" id="stocklist-${p.id}">
          ${stocks.map((s,i)=>`<div class="stock-item"><span style="font-family:'Space Mono',monospace;font-size:12px;">${s}</span><button class="del-stock" onclick="delStock('${p.id}',${i})">×</button></div>`).join('')}
        </div>
      </div>`:''}
    </div>`;
  }).join('');
}

function addStock(pid){
  const input = document.getElementById('stock-input-'+pid);
  const lines = input.value.trim().split('\n').filter(l=>l.trim());
  if(lines.length===0){showNotif('⚠️ Input stock kosong!','error');return;}
  if(!state.stocks[pid]) state.stocks[pid]=[];
  state.stocks[pid].push(...lines.map(l=>l.trim()));
  saveStocks();
  input.value='';
  renderStockManager();
  renderProducts();
  showNotif(`✅ ${lines.length} stock ditambahkan!`);
}
function delStock(pid,idx){
  state.stocks[pid].splice(idx,1);
  saveStocks();
  renderStockManager();
  renderProducts();
}
function clearStock(pid){
  if(!confirm('Hapus semua stock?')) return;
  state.stocks[pid]=[];
  saveStocks();
  renderStockManager();
  renderProducts();
  showNotif('🗑 Stock dihapus.','error');
}

// ============================================================
// UTILS
// ============================================================
function showPage(name){
  document.getElementById('page-home').classList.toggle('hidden', name!=='home');
  document.getElementById('page-admin').classList.toggle('hidden', name!=='admin');
  document.querySelectorAll('.nav-btn:not(.admin-btn)').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('onclick')&&b.getAttribute('onclick').includes(name));
  });
}

function showNotif(msg, type='success'){
  const existing = document.querySelector('.notif');
  if(existing) existing.remove();
  const n = document.createElement('div');
  n.className='notif';
  n.style.borderColor = type==='error' ? 'var(--neon-pink)' : 'var(--neon-green)';
  n.style.color = type==='error' ? 'var(--neon-pink)' : 'var(--neon-green)';
  n.style.boxShadow = type==='error' ? '0 0 20px rgba(255,0,128,0.3)' : '0 0 20px rgba(0,255,136,0.3)';
  n.textContent = msg;
  document.body.appendChild(n);
  setTimeout(()=>n.remove(), 3000);
}

// INIT
renderProducts();
</script>
